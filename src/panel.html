<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סוכן הדיג'יי</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --accent: #6d28d9; --accent-soft: #ede9fe; --ok: #15803d; --ok-soft: #dcfce7;
    --warn: #b45309; --warn-soft: #fef3c7; --bad: #b91c1c; --bad-soft: #fee2e2;
    --log-bg: #0f1420; --log-text: #d6dbe5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --text: #e6e9ef; --muted: #8b95a5; --line: #2a313c;
      --accent: #a78bfa; --accent-soft: #2e2550; --ok: #4ade80; --ok-soft: #12331f;
      --warn: #fbbf24; --warn-soft: #3a2c0b; --bad: #f87171; --bad-soft: #3b1414;
      --log-bg: #0a0d13; --log-text: #c9d1dc;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI", Arial, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1200px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  h1 { font-size: 20px; margin: 0; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-weight: 600; font-size: 14px; background: var(--line); }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pill.running { background: var(--ok-soft); color: var(--ok); }
  .pill.waiting { background: var(--accent-soft); color: var(--accent); }
  .pill.busy { background: var(--warn-soft); color: var(--warn); }
  .pill.stopped { color: var(--muted); }
  .detail { color: var(--muted); font-size: 14px; flex: 1; min-width: 160px; }
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 7px 14px; border-radius: 8px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.danger { color: var(--bad); border-color: var(--bad); }
  button.small { padding: 4px 10px; font-size: 13px; }
  label.check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); cursor: pointer; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
  .col { display: grid; gap: 16px; align-content: start; min-width: 0; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  section h2 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .field { display: grid; gap: 4px; margin-bottom: 10px; }
  .field span { font-size: 13px; color: var(--muted); }
  input[type=text], input[type=number], input[type=search] { font: inherit; width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .msg { font-size: 13px; min-height: 18px; }
  .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
  .groups { max-height: 420px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; margin-top: 10px; }
  .group { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .group:last-child { border-bottom: 0; }
  .group .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group.off .name { color: var(--muted); }
  .group a { color: var(--muted); font-size: 12px; text-decoration: none; }
  .switch { position: relative; width: 38px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; border-radius: 22px; background: var(--line); transition: .15s; cursor: pointer; }
  .switch span::after { content: ""; position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { right: 19px; }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .empty { color: var(--muted); padding: 16px; text-align: center; }
  .log { background: var(--log-bg); color: var(--log-text); border-radius: 8px; padding: 10px 12px; height: 420px; overflow-y: auto; font: 13px/1.6 Consolas, "Courier New", monospace; }
  .log div { white-space: pre-wrap; word-break: break-word; }
  .log .t { color: #7d8799; margin-left: 8px; direction: ltr; unicode-bidi: isolate; }
  .log .ok { color: #4ade80; } .log .bad { color: #f87171; } .log .warn { color: #fbbf24; } .log .hit { color: #c4b5fd; font-weight: 600; } .log .skip { color: #7d8799; }
  .leads { display: grid; gap: 10px; }
  .lead { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .lead .who { font-weight: 600; }
  .lead .meta { color: var(--muted); font-size: 13px; }
  .lead p { margin: 6px 0; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .lead a { color: var(--accent); font-size: 14px; }
  .stat { font-size: 14px; color: var(--muted); }
  .stat b { color: var(--text); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>🎧 סוכן הדיג'יי</h1>
    <span id="pill" class="pill stopped">כבוי</span>
    <span id="detail" class="detail"></span>
    <span class="stat">נשלחו לווצאפ: <b id="sent">0</b></span>
    <div class="controls">
      <label class="check" title="סורק ומציג בלוג, בלי לשלוח לווצאפ"><input type="checkbox" id="dry"> מצב בדיקה</label>
      <button id="start" class="primary">▶ הפעל</button>
      <button id="stop" class="danger">■ עצור</button>
    </div>
  </div>
</header>

<main>
  <div class="col">
    <section>
      <h2>הגדרות</h2>
      <p class="hint">נשמר מיד. אם הסוכן באמצע סבב – יחול מהסבב הבא.</p>
      <form id="settings">
        <label class="field"><span>מספר הטלפון שלך (לשם נשלחים הפוסטים בווצאפ)</span><input type="text" name="phone" inputmode="tel" placeholder="0501234567"></label>
        <label class="field"><span>כמה ימים אחורה (פוסט ישן יותר לא נשלח)</span><input type="number" name="max_post_age_days" min="1" step="1"></label>
        <label class="field"><span>כל כמה דקות לסרוק מחדש (0 = סבב אחד)</span><input type="number" name="run_every_minutes" min="0" step="1"></label>
        <label class="field"><span>כמה גלילות בפיד הראשי (0 = לא לסרוק את הפיד)</span><input type="number" name="feed_scrolls" min="0" step="1"></label>
        <label class="field"><span>מקסימום גלילות בכל קבוצה</span><input type="number" name="max_scrolls_per_group" min="1" step="1"></label>
        <div class="row"><button type="submit" class="primary" id="saveSettings" disabled>שמור הגדרות</button><span id="settingsMsg" class="msg"></span></div>
      </form>
    </section>

    <section>
      <h2>קבוצות <span class="stat"><b id="groupsOn">0</b> מתוך <b id="groupsAll">0</b> פעילות</span></h2>
      <div class="row">
        <input type="search" id="groupFilter" placeholder="חיפוש קבוצה..." style="flex:1;min-width:140px">
      </div>
      <div class="row" style="margin-top:8px">
        <button class="small" id="allOn">הפעל את המוצגות</button>
        <button class="small" id="allOff">כבה את המוצגות</button>
        <button class="small" id="import" title="פותח את פייסבוק ומוסיף קבוצות חדשות שהצטרפת אליהן">⟳ ייבוא קבוצות מפייסבוק</button>
      </div>
      <div class="msg" id="groupsMsg"></div>
      <div class="groups" id="groups"></div>
    </section>
  </div>

  <div class="col">
    <section>
      <h2>מה הסוכן עושה <label class="check"><input type="checkbox" id="follow" checked> גלילה אוטומטית</label></h2>
      <div class="log" id="log"></div>
    </section>

    <section>
      <h2>פוסטים שנשלחו אליך לאחרונה</h2>
      <div class="leads" id="leads"></div>
    </section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

let status = { state: 'stopped' };
let groups = [];

const STATES = {
  stopped: ['כבוי', 'stopped'],
  starting: ['מתחיל', 'busy'],
  scanning: ['סורק', 'running'],
  waiting: ['ממתין לסבב הבא', 'waiting'],
  stopping: ['עוצר', 'busy'],
  importing: ['מייבא קבוצות', 'busy'],
};

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'שגיאה');
  return data;
}

// ---------- status ----------
function renderStatus() {
  const [label, cls] = STATES[status.state] || [status.state, 'busy'];
  $('pill').textContent = label + (status.dryRun && status.state !== 'stopped' ? ' (בדיקה)' : '');
  $('pill').className = 'pill ' + cls;
  $('sent').textContent = status.sent || 0;
  const busy = status.state !== 'stopped';
  $('start').disabled = busy;
  $('stop').disabled = !busy || status.state === 'stopping' || status.state === 'importing';
  $('import').disabled = busy;
  $('dry').disabled = busy;
  renderDetail();
}
function renderDetail() {
  let text = status.detail || '';
  if (status.state === 'waiting' && status.nextRoundAt) {
    const left = Math.max(0, Math.round((status.nextRoundAt - Date.now()) / 1000));
    text = `סבב הבא בעוד ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  }
  $('detail').textContent = text;
}
setInterval(renderDetail, 1000);

$('start').onclick = async () => {
  try { await api('/api/start', { dryRun: $('dry').checked }); } catch (e) { alert(e.message); }
};
$('stop').onclick = () => api('/api/stop', {}).catch((e) => alert(e.message));

// ---------- settings ----------
function fillSettings(s) {
  for (const [k, v] of Object.entries(s)) if ($('settings').elements[k]) $('settings').elements[k].value = v;
  $('saveSettings').disabled = false; // only once the real values are in the form
}
let msgTimers = {};
function flash(id, text, ok) {
  const el = $(id);
  el.className = 'msg ' + (ok ? 'ok' : 'bad');
  el.textContent = text;
  clearTimeout(msgTimers[id]);
  msgTimers[id] = setTimeout(() => (el.textContent = ''), ok ? 4000 : 8000);
}
$('settings').onsubmit = async (ev) => {
  ev.preventDefault();
  const values = Object.fromEntries(new FormData($('settings')));
  try {
    const { settings } = await api('/api/settings', values);
    fillSettings(settings);
    flash('settingsMsg', status.state === 'stopped' ? '✔ נשמר' : '✔ נשמר – יחול מהסבב הבא', true);
  } catch (e) {
    flash('settingsMsg', e.message, false);
  }
};

// ---------- groups ----------
function visibleGroups() {
  const q = $('groupFilter').value.trim().toLowerCase();
  return groups.filter((g) => !q || (g.name || g.id).toLowerCase().includes(q));
}
function renderGroups() {
  $('groupsAll').textContent = groups.length;
  $('groupsOn').textContent = groups.filter((g) => g.enabled).length;
  const list = visibleGroups();
  if (!groups.length) {
    $('groups').innerHTML = '<div class="empty">אין עדיין קבוצות. לחץ "ייבוא קבוצות מפייסבוק".</div>';
    return;
  }
  $('groups').innerHTML = list.length
    ? list.map((g) => `
      <div class="group ${g.enabled ? '' : 'off'}">
        <label class="switch" title="${g.enabled ? 'פעילה – לחץ לכיבוי' : 'כבויה – לחץ להפעלה'}">
          <input type="checkbox" data-id="${esc(g.id)}" ${g.enabled ? 'checked' : ''}><span></span>
        </label>
        <span class="name" title="${esc(g.name || g.id)}">${esc(g.name || g.id)}</span>
        <a href="${esc(g.url)}" target="_blank" rel="noopener" title="פתח בפייסבוק">↗</a>
      </div>`).join('')
    : '<div class="empty">אין קבוצות שמתאימות לחיפוש</div>';
}
async function saveGroups(changes) {
  try {
    ({ groups } = await api('/api/groups', { changes }));
    renderGroups();
    flash('groupsMsg', status.state === 'stopped' ? '✔ נשמר' : '✔ נשמר – יחול מהסבב הבא', true);
  } catch (e) {
    flash('groupsMsg', e.message, false);
  }
}
$('groups').onchange = (ev) => {
  if (ev.target.dataset.id) saveGroups({ [ev.target.dataset.id]: ev.target.checked });
};
$('groupFilter').oninput = renderGroups;
$('allOn').onclick = () => saveGroups(Object.fromEntries(visibleGroups().map((g) => [g.id, true])));
$('allOff').onclick = () => saveGroups(Object.fromEntries(visibleGroups().map((g) => [g.id, false])));
$('import').onclick = () => api('/api/import-groups', {}).catch((e) => alert(e.message));

// ---------- log ----------
function logClass(text) {
  if (/✘|שגיאה|נכשל/.test(text)) return 'bad';
  if (/⚠/.test(text)) return 'warn';
  if (/🎯/.test(text)) return 'hit';
  if (/✔|▶/.test(text)) return 'ok';
  if (/⏭/.test(text)) return 'skip';
  return '';
}
function addLog({ time, text }) {
  const box = $('log');
  const div = document.createElement('div');
  div.className = logClass(text);
  div.innerHTML = `<span class="t">${esc(time)}</span>${esc(text)}`;
  box.appendChild(div);
  while (box.children.length > 800) box.firstChild.remove();
  if ($('follow').checked) box.scrollTop = box.scrollHeight;
}

// ---------- leads ----------
function timeAgo(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 60) return `לפני ${m} דק'`;
  if (m < 1440) return `לפני ${Math.round(m / 60)} שעות`;
  return new Date(iso).toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
}
let leads = [];
function renderLeads() {
  $('leads').innerHTML = leads.length
    ? leads.map((l) => `
      <div class="lead">
        <div class="who">${esc(l.authorName || 'לא ידוע')}</div>
        <div class="meta">${l.groupName ? `בקבוצה ${esc(l.groupName)} · ` : ''}נשלח ${esc(timeAgo(l.createdAt))}</div>
        <p>${esc(l.postText)}</p>
        ${/^https?:/.test(l.postKey) ? `<a href="${esc(l.postKey)}" target="_blank" rel="noopener">פתח את הפוסט ↗</a>` : ''}
      </div>`).join('')
    : '<div class="empty">עוד לא נשלחו פוסטים</div>';
}

// ---------- start ----------
async function load() {
  const s = await api('/api/state');
  status = s.status;
  groups = s.groups;
  leads = s.leads;
  fillSettings(s.settings);
  renderStatus();
  renderGroups();
  renderLeads();
  $('log').innerHTML = '';
  s.logs.forEach(addLog);
}

load().catch(() => {});
const live = new EventSource('/api/events');
live.addEventListener('log', (e) => addLog(JSON.parse(e.data)));
live.addEventListener('status', (e) => { status = JSON.parse(e.data); renderStatus(); });
live.addEventListener('lead', (e) => { leads = [JSON.parse(e.data), ...leads].slice(0, 30); renderLeads(); });
live.addEventListener('groups', () => api('/api/state').then((s) => { groups = s.groups; renderGroups(); }));
let connectedOnce = false;
live.onopen = () => {
  if (connectedOnce) load().catch(() => {}); // reconnected after the agent window restarted
  connectedOnce = true;
};
</script>
</body>
</html>
