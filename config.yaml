# הגדרות סוכן הדיג'יי לפייסבוק
# ----------------------------------

# לשלוח רק פוסטים שהועלו עד X ימים אחורה (פוסט ישן יותר – מדלגים)
max_post_age_days: 3

# ---- שליחת כל פוסט שנמצא אליך לווצאפ ----
# phone = המספר שלך (למשל 0501234567). ההודעות יישלחו לצ'אט "אני" שלך דרך ווצאפ ווב
# (בפעם הראשונה סורקים QR).
whatsapp:
  phone: ""

# לחזור על הסריקה כל X דקות (0 = לסרוק פעם אחת ולצאת)
run_every_minutes: 60

# לסמן "מעניין אותי" בפייסבוק על כל פוסט שנשלח אליך, כדי שהפיד יציג עוד פוסטים כאלה
# (true = כן, false = לא)
mark_interested: true

# ---- מה לסרוק (לפי הסדר) ----

# 1. הפיד הראשי: כמה פעמים לגלול (0 = לא לסרוק את הפיד)
feed_scrolls: 40

# 2. קבוצות: ממוינות מהחדש לישן, ונסרקות עד שמגיעים לפוסטים ישנים מ-max_post_age_days. בנוסף, הסוכן זוכר את הפוסט הכי חדש
#    שבדק בכל קבוצה (groups_last_seen.json), ובסבב הבא עוצר כשהוא מגיע אליו – כך נבדקים רק
#    הפוסטים החדשים.
#    הכי קל: להריץ  node index.js --import-groups  – הסוכן אוסף לבד את כל הקבוצות שלך
#    לקובץ groups.txt. שם אפשר לכבות קבוצה עם # בתחילת השורה.
#    אפשר גם להוסיף כאן ידנית, למשל: - https://www.facebook.com/groups/123456789
groups_file: ./groups.txt
groups: []

# הגבלת ביטחון: מקסימום גלילות בקבוצה, גם אם עוד לא הגענו לפוסטים ישנים
max_scrolls_per_group: 100

# כמה שניות (אקראי) לחכות בין גלילות
delay_between_scrolls: [3, 7]

# ביטויים (regex) שמזהים פוסט של מישהו שמחפש דיג'יי.
# השאר ריק כדי להשתמש ברשימה המובנית (מחפש/צריך/ממליצים ... דיג'יי / די ג'יי / DJ / תקליטן).
include_patterns: []
# ביטויים שמסננים החוצה (למשל דיג'יים שמפרסמים את עצמם). ריק = רשימה מובנית.
exclude_patterns: []

# היפוך עברית בחלון השחור (ב-Windows העברית מוצגת שם הפוכה). ריק = אוטומטי (רק ב-Windows),
# true = תמיד, false = אף פעם. הקובץ dj_agent.log תמיד נשמר רגיל.
terminal_hebrew_fix:

# תיקייה לפרופיל הדפדפן (שומר את ההתחברות לפייסבוק ולווצאפ) ולהיסטוריית השליחות
browser_profile_dir: ./browser_profile
history_file: ./history.json
