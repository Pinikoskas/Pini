# הגדרות סוכן הדיג'יי לפייסבוק
# ----------------------------------

# מצב עבודה:
#   dry_run  – רק מחפש ומדפיס אילו פוסטים מצא, לא שולח כלום (מומלץ להתחיל כך)
#   confirm  – לפני כל פוסט שואל אותך בטרמינל אם לשלוח (y/n)
#   auto     – שולח לבד, בלי לשאול
mode: confirm

# להגיב רק על פוסטים שהועלו לפני פחות מ-X ימים (פוסט ישן יותר – מדלגים)
max_post_age_days: 7

# מה לעשות על כל פוסט מתאים
send_comment: true
send_messenger: true

# הודעות. {name} יוחלף בשם הפרטי של כותב הפוסט (אם זוהה).
comment_text: |
  היי {name}! אני דיג'יי ואשמח לעזור 🎧 שלחתי לך הודעה בפרטי

messenger_text: |
  היי {name}, ראיתי את הפוסט שלך על דיג'יי 🙂
  אני פיני, דיג'יי לחתונות, בר/בת מצוות ואירועים.
  אשמח לשלוח פרטים והצעת מחיר – לאיזה תאריך ואיזה אירוע?

# אילו עמודים לסרוק (לפי הסדר). ברירת מחדל: הפיד הראשי.
# אפשר להוסיף קבוצות, למשל: https://www.facebook.com/groups/123456789
sources:
  - https://www.facebook.com/
  # חיפוש בכל פייסבוק אחרי פוסטים:
  - https://www.facebook.com/search/posts?q=מחפש%20דיג'יי
  - https://www.facebook.com/search/posts?q=צריך%20DJ

# כמה פעמים לגלול בכל עמוד
max_scrolls_per_source: 40

# מגבלות בטיחות – כדי שפייסבוק לא יחסום את החשבון
max_comments_per_run: 5
max_messages_per_run: 5
# המתנה אקראית (בשניות) בין פעולות
delay_between_actions: [45, 120]
delay_between_scrolls: [3, 7]
# לא לשלוח שוב הודעה לאותו אדם בתוך X ימים
dont_message_same_person_days: 30

# ביטויים (regex) שמזהים פוסט של מישהו שמחפש דיג'יי.
# השאר ריק כדי להשתמש ברשימה המובנית (מחפש/צריך/ממליצים ... דיג'יי / די ג'יי / DJ / תקליטן).
include_patterns: []
# ביטויים שמסננים החוצה (למשל דיג'יים שמפרסמים את עצמם). ריק = רשימה מובנית.
exclude_patterns: []

# תיקייה לפרופיל הדפדפן (שומר את ההתחברות לפייסבוק) ולהיסטוריית השליחות
browser_profile_dir: ./browser_profile
history_file: ./history.json
