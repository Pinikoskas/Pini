# הגדרות סוכן הדיג'יי לפייסבוק
# ----------------------------------

# לשלוח רק פוסטים שהועלו עד X ימים אחורה (פוסט ישן יותר – מדלגים)
max_post_age_days: 3

# ---- שליחת כל פוסט שנמצא אליך לווצאפ ----
# phone = המספר שלך (למשל 0501234567). ההודעות יישלחו לצ'אט "אני" שלך דרך ווצאפ ווב
# (בפעם הראשונה סורקים QR).
whatsapp:
  phone: ""

# לחזור על הסריקה כל X דקות (0 = לסרוק פעם אחת ולצאת)
run_every_minutes: 60

# אילו עמודים לסרוק (לפי הסדר). ברירת מחדל: הפיד הראשי.
# אפשר להוסיף קבוצות, למשל: https://www.facebook.com/groups/123456789
sources:
  - https://www.facebook.com/
  # חיפוש בכל פייסבוק אחרי פוסטים:
  - https://www.facebook.com/search/posts?q=מחפש%20דיג'יי
  - https://www.facebook.com/search/posts?q=צריך%20DJ

# כמה פעמים לגלול בכל עמוד, וכמה שניות (אקראי) לחכות בין גלילות
max_scrolls_per_source: 40
delay_between_scrolls: [3, 7]

# ביטויים (regex) שמזהים פוסט של מישהו שמחפש דיג'יי.
# השאר ריק כדי להשתמש ברשימה המובנית (מחפש/צריך/ממליצים ... דיג'יי / די ג'יי / DJ / תקליטן).
include_patterns: []
# ביטויים שמסננים החוצה (למשל דיג'יים שמפרסמים את עצמם). ריק = רשימה מובנית.
exclude_patterns: []

# תיקייה לפרופיל הדפדפן (שומר את ההתחברות לפייסבוק ולווצאפ) ולהיסטוריית השליחות
browser_profile_dir: ./browser_profile
history_file: ./history.json
